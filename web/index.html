<!DOCTYPE html>
<html>
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Junior Eventos - Vanguardia y Excelencia.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Junior Eventos">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <title>Junior Eventos</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #0c0c0c;
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #D4AF37;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    .brand { font-size: 20px; font-weight: 800; letter-spacing: 5px; text-transform: uppercase; }
  </style>
</head>
<body>
  <div id="loading-indicator">
    <div class="brand">Junior Eventos</div>
  </div>

  <script>
    // Hide loading indicator once Flutter renders its canvas
    const observer = new MutationObserver(function(mutations) {
      const flutterCanvas = document.querySelector('flt-glass-pane, flt-scene, flutter-view');
      if (flutterCanvas) {
        const loadingEl = document.querySelector('#loading-indicator');
        if (loadingEl) {
          loadingEl.style.transition = 'opacity 0.6s ease';
          loadingEl.style.opacity = '0';
          setTimeout(() => loadingEl.remove(), 600);
        }
        observer.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
